name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - name: Simulate
        run: make
      - name: Synthesise for ECP5
        run: |
          mkdir -p build
          for top in fifo uart_tx uart_rx; do
            echo "== $top"
            yosys -q -p "read_verilog rtl/*.v; synth_ecp5 -top $top; tee -a build/$top.txt stat"
            cat build/$top.txt
          done
